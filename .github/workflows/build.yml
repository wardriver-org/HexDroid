name: Build Release APK

on:
  push:
    branches: [feature/dropfo-catppuccin-dracula]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: native/agebridge/go.mod
      - name: Install Android native toolchain
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build and test age bridge
        run: ./scripts/build-age-android.sh
      - name: Configure release signing when available
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Test and build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --no-build-cache
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android privacy regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HexDroid-test-reports
          path: app/build/reports
          if-no-files-found: ignore
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HexDroid-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
